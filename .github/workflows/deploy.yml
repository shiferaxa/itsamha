name: Deploy to AWS

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild so new Credly badges show up without a code change
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  S3_BUCKET: itsamha.com
  CLOUDFRONT_DISTRIBUTION_ID: E1RT76ETYBB5J6

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch certifications from Credly
        run: python scripts/fetch_certifications.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync site to S3
        run: |
          # Long cache for assets, short for HTML/JSON so updates show quickly
          aws s3 sync website/ "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public,max-age=86400" \
            --exclude "*.html" --exclude "*.json"
          aws s3 sync website/ "s3://${S3_BUCKET}/" \
            --cache-control "public,max-age=300,must-revalidate" \
            --exclude "*" --include "*.html" --include "*.json"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
